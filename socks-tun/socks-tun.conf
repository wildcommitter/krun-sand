# socks-tun configuration (installed to /etc/socks-tun.conf)

# SOCKS5 proxy all tunneled traffic goes through. Default: local Tor.
# Auth: socks5://user:pass@host:port
SOCKS_URL=socks5://127.0.0.1:9050

# What kind of proxy SOCKS_URL is; decides how DNS (udp/53 + tcp/53) is resolved.
#   tor     Tor's DNSPort resolves (TOR_DNS_PORT). install.sh enables it in torrc.
#   socks5  stock SOCKS5 has no resolver: queries go to DNS_UPSTREAM as
#           DNS-over-TCP through the proxy.
PROXY_TYPE=tor
TOR_DNS_PORT=127.0.0.1:9053
DNS_UPSTREAM=1.1.1.1:53

# TUN device; bind to it (e.g. ai-sand egress = "socks0") to use the proxy.
TUN_DEV=socks0
TUN_ADDR=10.66.66.1
# Policy-routing table and rule priority used for the device.
TABLE=6666

# Relay listen ports (on TUN_ADDR).
RELAY_TCP_PORT=12345
RELAY_DNS_PORT=10053
